# The asset library: the diagrams this project ships with. Sources and licences
# are in CREDITS.md beside this file.
#
# `depicts` is what the asset shows, in the words someone would search for; it
# is matched against what the speaker actually says. `anchors` are phrases the
# asset should appear on, in preference order -- an asset with anchors places
# itself whenever one survives the cut, rather than waiting for the judge to
# name it. `sequence` + `order` mark a build-up: one visual that changes,
# chained with no gap between steps. Entries whose file is missing are skipped.
#
# Replace these with your own library (point `assets_dir` at it) or leave it
# empty: an empty library still renders, and beats with no match are dropped.

[[asset]]
id = "p1-scout"
file = "p1-scout.png"
depicts = "agent pipeline diagram scout stage only"
kind = "card"
sequence = "pipeline"
order = 1
anchors = ["a scout agent passing", "so a scout agent", "but scout agent"]
# Ordering note: every anchor below starts LATER in the sentence than the step
# before it, so consecutive steps never collapse onto the same instant.

